---
# Host-specific variables for marconi (GPS/NTP server).

# Hand-calibrated NMEA offset for marconi's GPS receiver.
gps_ntp_nmea_offset: 0.265

# The Pi 5's onboard Ethernet has a PTP hardware clock and timestamps all
# received packets.
gps_ntp_hwtimestamp_interfaces:
  - end0

# Wired into the Services VLAN; Wi-Fi would put a second leg on LAN.
common_wifi_enabled: false
